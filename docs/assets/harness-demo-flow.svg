<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harness Kit execution flow</title>
  <desc id="desc">An animated terminal and task graph showing context, frontend and backend workstreams, integration, verification, and a completed demo.</desc>
  <style>
    .edge { stroke-dasharray: 8 10; animation: flow 3s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .delay1 { animation-delay: .35s; }
    .delay2 { animation-delay: .7s; }
    .delay3 { animation-delay: 1.05s; }
    .blink { animation: blink 1.1s steps(2,end) infinite; }
    @keyframes flow { to { stroke-dashoffset: -36; } }
    @keyframes pulse { 0%,100% { opacity:.65; transform:scale(.92); } 50% { opacity:1; transform:scale(1.08); } }
    @keyframes blink { 50% { opacity:0; } }
  </style>
  <rect width="1200" height="560" rx="26" fill="#0c1020"/>
  <rect x="28" y="28" width="360" height="504" rx="18" fill="#11172a" stroke="#2a324d"/>
  <circle cx="56" cy="56" r="6" fill="#ff6b6b"/><circle cx="76" cy="56" r="6" fill="#ffbf4d"/><circle cx="96" cy="56" r="6" fill="#61d38b"/>
  <text x="122" y="62" fill="#77809b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">agent-harness</text>
  <line x1="28" y1="82" x2="388" y2="82" stroke="#252d46"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="52" y="122" fill="#77809b">$</text><text x="72" y="122" fill="#f5f7ff">agent-harness run</text><rect class="blink" x="244" y="106" width="8" height="20" fill="#4f6cff"/>
    <text x="52" y="168" fill="#61d38b">✓</text><text x="78" y="168" fill="#cbd2e8">PROJECT-CONTEXT approved</text>
    <text x="52" y="204" fill="#61d38b">✓</text><text x="78" y="204" fill="#cbd2e8">PENDING synced</text>
    <text x="52" y="240" fill="#61d38b">✓</text><text x="78" y="240" fill="#cbd2e8">TASK-GRAPH active</text>
    <text x="52" y="294" fill="#77809b">workstreams</text>
    <rect x="52" y="314" width="126" height="32" rx="8" fill="#1a2442"/><text x="69" y="335" fill="#8da1ff">frontend</text>
    <rect x="190" y="314" width="116" height="32" rx="8" fill="#35251b"/><text x="209" y="335" fill="#ffc36a">backend</text>
    <text x="52" y="392" fill="#77809b">limits</text>
    <text x="52" y="425" fill="#cbd2e8">attempts  1 / 2</text>
    <text x="52" y="458" fill="#cbd2e8">reviews   1 / 2</text>
    <text x="52" y="502" fill="#61d38b">● continuing without approval</text>
  </g>

  <g fill="none" stroke="#3b4566" stroke-width="2.5">
    <path class="edge" d="M500 280C560 280 560 150 628 150"/>
    <path class="edge" d="M500 280C560 280 560 390 628 390"/>
    <path class="edge" d="M798 150C850 150 830 268 890 268"/>
    <path class="edge" d="M798 390C850 390 830 292 890 292"/>
    <path class="edge" d="M1018 280H1080"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <g class="pulse">
      <rect x="420" y="220" width="160" height="120" rx="16" fill="#171e35" stroke="#69728f"/>
      <text x="446" y="254" fill="#8f98b5" font-size="13" font-weight="700">CONTEXT</text>
      <text x="446" y="286" fill="#f5f7ff" font-size="18" font-weight="650">Approved scope</text>
      <text x="446" y="315" fill="#8f98b5" font-size="13">read · rules · goals</text>
    </g>
    <g class="pulse delay1">
      <rect x="628" y="94" width="170" height="112" rx="16" fill="#172142" stroke="#4f6cff"/>
      <text x="652" y="128" fill="#8da1ff" font-size="13" font-weight="700">FRONTEND</text>
      <text x="652" y="160" fill="#f5f7ff" font-size="18" font-weight="650">Demo screen</text>
      <text x="652" y="185" fill="#8f98b5" font-size="13">isolated lease</text>
    </g>
    <g class="pulse delay1">
      <rect x="628" y="334" width="170" height="112" rx="16" fill="#35251b" stroke="#ffb84d"/>
      <text x="652" y="368" fill="#ffc36a" font-size="13" font-weight="700">BACKEND</text>
      <text x="652" y="400" fill="#f5f7ff" font-size="18" font-weight="650">Working path</text>
      <text x="652" y="425" fill="#a9957a" font-size="13">isolated lease</text>
    </g>
    <g class="pulse delay2">
      <rect x="866" y="224" width="176" height="112" rx="16" fill="#19293a" stroke="#61d38b"/>
      <text x="890" y="258" fill="#72dda0" font-size="13" font-weight="700">INTEGRATION</text>
      <text x="890" y="290" fill="#f5f7ff" font-size="18" font-weight="650">Checks + review</text>
      <text x="890" y="315" fill="#8f98b5" font-size="13">impact set verified</text>
    </g>
    <g class="pulse delay3">
      <rect x="1070" y="226" width="104" height="108" rx="54" fill="#61d38b"/>
      <path d="M1100 279l15 15 30-34" fill="none" stroke="#0c1020" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1083" y="366" fill="#72dda0" font-size="13" font-weight="800">DEMO READY</text>
    </g>
  </g>
  <text x="420" y="510" fill="#77809b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">read_set → write_set → impact_set → complete</text>
</svg>
